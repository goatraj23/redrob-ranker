# ============================================================================
# AI tools declaration (transparency only — honest declaration is not penalised)
# ============================================================================
ai_tools_used:
  - "Claude"

ai_usage_summary: |
  Claude was used as a pair-programming and code-review assistant while
  developing the ranker. No AI model is used at runtime: the ranking pipeline
  (rank.py) is pure Python standard library, calls no LLM/API/GPU, and runs with
  the network off. No candidate data was sent to any hosted LLM.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Transparent composite ranker over cheap features, parallelised with the
  stdlib multiprocessing module and gated by a conservative pre-filter so the
  expensive text scan only runs on candidates that could plausibly reach the
  top 100. Seven bounded components (role/title, JD-concept domain match,
  experience band, product-vs-services company, corroborated skills,
  education, location) are combined as a weighted sum, then modified
  MULTIPLICATIVELY by three gates: a disqualifier multiplier (consulting-only
  career, vision/speech/robotics-only, research-only, recent-framework-only,
  title-chasing), a behavioural-availability multiplier (recency, recruiter
  response rate, open-to-work, notice period), and a honeypot/consistency gate
  that forces impossible profiles to the bottom — both internally impossible
  (contradictory dates/durations/skills) and world-impossible (roles starting
  before the employer company was founded, the brief's canonical honeypot);
  0% honeypots of either class in our top 100. Domain fit is read from
  career-history TEXT, not skill tags,
  so a "Marketing Manager" stuffed with AI keywords loses to a product-company
  engineer who actually built a recommendation system. Weights are hand-set
  priors in scoring.py; the ranker is deterministic and uses no ML model.
  Offline evaluation is run against two independent label sets (career-history
  rubric and a deliberately different headline-only rubric) so the metrics
  aren't self-validating. Runs in ~3 s for 100K on 8 CPU cores, no network.

