# ============================================================================
ai_tools_used:
  - "Claude"

ai_usage_summary: |
  Claude was used as a pair-programming and code-review assistant while
  developing the ranker. No AI model is used at runtime: the ranking pipeline
  (rank.py) is pure Python standard library, calls no LLM/API/GPU, and runs with
  the network off. No candidate data was sent to any hosted LLM.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Transparent composite ranker over precomputed, cheap features. Seven bounded
  components (role/title, JD-concept domain match, experience band, product-vs-
  services company, corroborated skills, education, location) are combined as a
  weighted sum, then modified MULTIPLICATIVELY by three gates: a disqualifier
  multiplier (consulting-only career, vision/speech/robotics-only, research-only,
  recent-framework-only, title-chasing), a behavioural-availability multiplier
  (recency, recruiter response rate, open-to-work, notice period), and a
  honeypot/consistency gate that forces internally-impossible profiles to the
  bottom (0% honeypots in our top 100). Domain fit is read from career-history
  TEXT, not skill tags, so a "Marketing Manager" stuffed with AI keywords loses
  to a product-company engineer who actually built a recommendation system.
  Weights are hand-set priors defined in scoring.py; the ranker is deterministic
  and uses no machine-learning model. Runs in ~35s for 100K on CPU, no network.

